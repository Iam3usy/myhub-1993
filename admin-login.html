<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; padding: 0; background-color: #09090b; }
        .login-container { width: 90%; max-width: 400px; }
        .form-box { background: rgba(25, 25, 30, 0.7); padding: 30px 20px; border-radius: 15px; border: 1px solid #333; }
        .form-box h2 { text-align: center; color: #ff0050; margin-bottom: 20px; }
        .form-box input { width: 100%; padding: 15px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; border-radius: 10px; font-family: 'Padauk'; }
        .form-box input:focus { outline: none; border-color: #ff0050; }
        .form-box button { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff0050, #ff4d80); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; font-family: 'Padauk'; margin-top: 10px; }
        .error { color: #ff0050; font-size: 14px; text-align: center; margin-top: 15px; font-weight: bold; }
        .back-home { display: block; text-align: center; margin-top: 20px; color: #aaa; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="form-box">
            <h2>Admin Login</h2>
            
            <input type="text" id="adminUser" placeholder="Admin Username" onkeypress="handleEnter(event)">
            <input type="password" id="adminPass" placeholder="Admin Password" onkeypress="handleEnter(event)">
            
            <button onclick="adminLogin()" id="loginBtn">Login</button>
            
            <p id="errorMsg" class="error"></p>

            <a href="index.html" class="back-home">← Back to Website</a>
        </div>
    </div>

    <script>
        const API_URL = "https://myhubapp.dathalay1.workers.dev"; 

        // တကယ်လို့ အကောင့်ဝင်ထားပြီးသားဆိုရင် Admin Page ကို တိုက်ရိုက်ပို့မယ်
        if(localStorage.getItem('admin_logged_in') === 'true') {
            window.location.href = 'admin.html';
        }

        function handleEnter(e) {
            if (e.key === 'Enter') adminLogin();
        }

        async function adminLogin() {
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            if(!username || !password) {
                errorMsg.innerText = "Please fill in all fields";
                return;
            }

            btn.innerText = "Checking...";
            btn.disabled = true;
            btn.style.opacity = "0.7";
            errorMsg.innerText = "";

            try {
                const res = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('admin_logged_in', 'true');
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.innerText = data.error || "Invalid Credentials";
                    btn.innerText = "Login";
                    btn.disabled = false;
                    btn.style.opacity = "1";
                }
            } catch (error) {
                errorMsg.innerText = "Server error. Please try again.";
                btn.innerText = "Login";
                btn.disabled = false;
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
