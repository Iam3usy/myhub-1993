<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #121212; color: white; }
        input, select, button { width: 100%; padding: 12px; margin: 5px 0 15px; box-sizing: border-box; border-radius: 5px; border: 1px solid #444; background: #1e1e1e; color: white; }
        button { background: #ff0050; color: white; border: none; font-weight: bold; cursor: pointer; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        h3 { margin-top: 0; color: #ff0050; }
        
        /* စာရိုက်ရှာတဲ့ Box နဲ့ Checkbox တွေအတွက် Design */
        .search-box { width: 100%; padding: 8px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ff0050; background: #222; color: white; }
        .checkbox-container { display: flex; flex-wrap: wrap; gap: 10px; max-height: 150px; overflow-y: auto; background: #111; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
        .checkbox-item { display: flex; align-items: center; gap: 5px; width: 45%; font-size: 14px; }
        .checkbox-item input { width: auto; margin: 0; }
    </style>
</head>
<body>

    <h2>Admin Panel</h2>
    <!-- ⚠️ မင်းရဲ့ Worker URL ကို ဒီမှာ ထည့်ပါ -->
    <script>const API_URL = "https://myhubapp.dathalay1.workers.dev";</script>

    <!-- ၁။ Category အသစ်ထည့်ရန် -->
    <div class="box">
        <h3>Category အသစ်ထည့်ရန်</h3>
        <input type="text" id="catName" placeholder="အမျိုးအစား နာမည်">
        <input type="text" id="catImage" placeholder="ပုံ Link (URL)">
        <button onclick="addCategory()">Category သိမ်းမယ်</button>
    </div>

    <!-- ၂။ မော်ဒယ် အသစ်ထည့်ရန် -->
    <div class="box">
        <h3>မော်ဒယ် အသစ်ထည့်ရန်</h3>
        <input type="text" id="modelName" placeholder="မော်ဒယ် နာမည်">
        <input type="text" id="modelImage" placeholder="ပုံ Link (URL)">
        <button onclick="addModel()">မော်ဒယ် သိမ်းမယ်</button>
    </div>

    <!-- ၃။ ဇာတ်ကား အသစ်ထည့်ရန် -->
    <div class="box">
        <h3>ဇာတ်ကား အသစ်ထည့်ရန်</h3>
        <input type="text" id="videoTitle" placeholder="ဇာတ်ကား နာမည်">
        <input type="text" id="videoThumb" placeholder="Preview MP4 URL">
        <input type="text" id="videoFileId" placeholder="Telegram File ID">
        
        <!-- ဇာတ်ကား VIP/Free ရွေးတဲ့နေရာ -->
        <label style="display: block; font-weight: bold; color: #ff0050;">အမျိုးအစား (VIP / Free)</label>
        <select id="videoVip" style="width: 100%; padding: 12px; margin: 5px 0 15px; border-radius: 5px; border: 1px solid #444; background: #1e1e1e; color: white;">
            <option value="0">အခမဲ့ (Free)</option>
            <option value="1">VIP (ရွှေရောင်)</option>
        </select>

        <!-- Category ရွေးတဲ့နေရာ (Search ပါ) -->
        <label style="font-weight:bold; font-size:14px;">Category ရွေးပါ</label>
        <input type="text" class="search-box" id="searchCat" onkeyup="filterCheckboxes('searchCat', 'cat-list')" placeholder="Category နာမည် ရိုက်ရှာပါ...">
        <div id="cat-list" class="checkbox-container"></div>
        
        <!-- Model ရွေးတဲ့နေရာ (Search ပါ) -->
        <label style="font-weight:bold; font-size:14px;">မော်ဒယ် ရွေးပါ</label>
        <input type="text" class="search-box" id="searchModel" onkeyup="filterCheckboxes('searchModel', 'model-list')" placeholder="မော်ဒယ် နာမည် ရိုက်ရှာပါ...">
        <div id="model-list" class="checkbox-container"></div>
        
        <button onclick="addVideo()">ဇာတ်ကား သိမ်းမယ်</button>
    </div>

    <!-- ၄။ User (VIP Key) အသစ်ထည့်ရန် -->
    <div class="box">
        <h3>User / VIP Key အသစ်ထည့်ရန်</h3>
        <input type="text" id="userName" placeholder="Username (ဥပမာ - user123)">
        <input type="text" id="userKey" placeholder="VIP Key (ဥပမာ - 123456)">
        <input type="date" id="userExpired" placeholder="Expired Date">
        <button onclick="addUser()">User သိမ်းမယ်</button>
    </div>

    <script>
        // Category တွေကို Checkbox အနေနဲ့ ဆွဲထည့်တာ
        async function loadCategories() {
            try {
                const res = await fetch(`${API_URL}/api/categories`);
                const cats = await res.json();
                const container = document.getElementById('cat-list');
                container.innerHTML = '';
                
                cats.forEach(c => {
                    container.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${c.id}" class="cat-checkbox"> ${c.name}
                        </label>
                    `;
                });
            } catch(e) { console.log("Error", e); }
        }

        // မော်ဒယ်တွေကို Checkbox အနေနဲ့ ဆွဲထည့်တာ
        async function loadModels() {
            try {
                const res = await fetch(`${API_URL}/api/models`);
                const models = await res.json();
                const container = document.getElementById('model-list');
                container.innerHTML = '';
                
                models.forEach(m => {
                    container.innerHTML += `
                        <label class="checkbox-item">
                            <input type="checkbox" value="${m.id}" class="model-checkbox"> ${m.name}
                        </label>
                    `;
                });
            } catch(e) { console.log("Error", e); }
        }

        // စာရိုက်ရှာတဲ့ Function (Checkbox တွေကို ဖျောက်/ပြ)
        function filterCheckboxes(inputId, containerId) {
            const filter = document.getElementById(inputId).value.toLowerCase();
            const items = document.getElementById(containerId).getElementsByClassName('checkbox-item');
            
            for (let i = 0; i < items.length; i++) {
                const text = items[i].textContent.toLowerCase();
                if (text.includes(filter)) {
                    items[i].style.display = "flex";
                } else {
                    items[i].style.display = "none";
                }
            }
        }

        // ၁။ Category သိမ်းတာ
        async function addCategory() {
            const name = document.getElementById('catName').value;
            const image = document.getElementById('catImage').value;

            const res = await fetch(`${API_URL}/api/admin/add-category`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, image })
            });
            
            if(res.ok) {
                alert("Category သိမ်းပြီးပါပြီ");
                document.getElementById('catName').value = ''; 
                document.getElementById('catImage').value = '';
                loadCategories(); 
            } else {
                alert("ဒီ Category နာမည် ရှိပြီးသား ဖြစ်နေပါတယ်။ တခြားနာမည် သုံးပါ။");
            }
        }

        // ၂။ မော်ဒယ် သိမ်းတာ
        async function addModel() {
            const name = document.getElementById('modelName').value;
            const image = document.getElementById('modelImage').value;
            
            const res = await fetch(`${API_URL}/api/admin/add-model`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, image })
            });
            
            if (res.ok) {
                alert("မော်ဒယ် သိမ်းပြီးပါပြီ");
                document.getElementById('modelName').value = ''; 
                document.getElementById('modelImage').value = '';
                loadModels();
            } else {
                alert("ဒီမော်ဒယ်နာမည် ရှိပြီးသား ဖြစ်နေပါတယ်။ တခြားနာမည် သုံးပါ။");
            }
        }

        // ၃။ ဇာတ်ကား သိမ်းတာ
        async function addVideo() {
            const title = document.getElementById('videoTitle').value;
            const preview_url = document.getElementById('videoThumb').value;
            const file_id = document.getElementById('videoFileId').value;
            const is_vip = document.getElementById('videoVip').value;

            const checkedCats = document.querySelectorAll('.cat-checkbox:checked');
            const category_ids = Array.from(checkedCats).map(cb => parseInt(cb.value));

            const checkedModels = document.querySelectorAll('.model-checkbox:checked');
            const model_ids = Array.from(checkedModels).map(cb => parseInt(cb.value));

            if(category_ids.length === 0) {
                alert("Category အနည်းဆုံး တစ်ခု ရွေးပါ");
                return;
            }

            const res = await fetch(`${API_URL}/api/admin/add-video`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ title, preview_url, file_id, category_ids, model_ids, is_vip })
            });
            
            if(res.ok) {
                alert("ဇာတ်ကား သိမ်းပြီးပါပြီ");
                document.getElementById('videoTitle').value = '';
                document.getElementById('videoThumb').value = '';
                document.getElementById('videoFileId').value = '';
                document.getElementById('videoVip').value = '0';
                document.querySelectorAll('.cat-checkbox:checked').forEach(cb => cb.checked = false);
                document.querySelectorAll('.model-checkbox:checked').forEach(cb => cb.checked = false);
            } else {
                alert("Error တက်နေပါတယ်");
            }
        }

        // ၄။ User သိမ်းတဲ့ Function (VIP Key)
        async function addUser() {
            const username = document.getElementById('userName').value;
            const key_code = document.getElementById('userKey').value;
            const expired_date = document.getElementById('userExpired').value;

            if(!username || !key_code || !expired_date) {
                alert("အချက်အလက်များ ပြည့်စုံအောင် ဖြည့်ပါ");
                return;
            }

            const res = await fetch(`${API_URL}/api/admin/add-user`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, key_code, expired_date })
            });
            
            if(res.ok) {
                alert("User သိမ်းပြီးပါပြီ");
                document.getElementById('userName').value = '';
                document.getElementById('userKey').value = '';
                document.getElementById('userExpired').value = '';
            } else {
                alert("Error တက်နေပါတယ် (Username ရှိပြီးသား ဖြစ်နိုင်ပါတယ်)");
            }
        }

        // စာမျက်နှာ စတင်တာနဲ့ အကုန်ခေါ်မယ်
        loadCategories();
        loadModels();
    </script>
</body>
</html>
